# Overlay adding the Safe-CBF-RRT* planner to the Gazebo simulation (Humble):
# docker compose -f compose.simulation.yaml -f compose.cbf.yaml up
# Use the `just cbf-*` recipes. The physical robot (Jazzy) uses compose.jazzy.yaml.

services:

  cbf-planner:
    build:
      context: .
      dockerfile: dockerfile.dev
    image: ros_dev_cbf:latest
    depends_on:
      - navigation
    volumes:
      - .:/workspace
    working_dir: /workspace
    environment:
      # must match the Nav2 container: True in Gazebo (/clock)
      - USE_SIM_TIME=${USE_SIM_TIME:-True}
    command: bash /workspace/scripts/cbf_planner_entrypoint.sh
